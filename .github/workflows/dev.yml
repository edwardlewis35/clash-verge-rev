name: Development Test

on:
  workflow_dispatch:
    inputs:
      run_windows:
        description: '运行 Windows'
        required: false
        type: boolean
        default: true
      run_macos_aarch64:
        description: '运行 macOS aarch64'
        required: false
        type: boolean
        default: true
      run_windows_arm64:
        description: '运行 Windows ARM64'
        required: false
        type: boolean
        default: true

permissions: write-all
env:
  TAG_NAME: deploytest
  TAG_CHANNEL: DeployTest
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dev:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            id: windows
            input: run_windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            id: macos-aarch64
            input: run_macos_aarch64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            id: windows-arm64
            input: run_windows_arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip job if not selected
        if: github.event.inputs[matrix.input] != 'true'
        run: echo "Job ${{ matrix.id }} skipped as requested"

      - name: Checkout Repository
        if: github.event.inputs[matrix.input] == 'true'
        uses: actions/checkout@v7

      - name: Install Rust Stable
        if: github.event.inputs[matrix.input] == 'true'
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04' && github.event.inputs[matrix.input] == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        if: github.event.inputs[matrix.input] == 'true'
        with:
          run_install: false

      - name: Install Node
        if: github.event.inputs[matrix.input] == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: 'pnpm'

      - name: Pnpm Cache
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: 'pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          restore-keys: |
            pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}
          lookup-only: true

      - name: Setup Go (macc core)
        if: github.event.inputs[matrix.input] == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Build macc-enabled verge-mihomo sidecar
        if: github.event.inputs[matrix.input] == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            x86_64-pc-windows-msvc)    GOOS=windows; GOARCH=amd64 ;;
            aarch64-pc-windows-msvc)   GOOS=windows; GOARCH=arm64 ;;
            x86_64-apple-darwin)       GOOS=darwin;  GOARCH=amd64 ;;
            aarch64-apple-darwin)      GOOS=darwin;  GOARCH=arm64 ;;
            x86_64-unknown-linux-gnu)  GOOS=linux;   GOARCH=amd64 ;;
            aarch64-unknown-linux-gnu) GOOS=linux;   GOARCH=arm64 ;;
            *) echo "unsupported target: $TARGET"; exit 1 ;;
          esac
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          SRC="$RUNNER_TEMP/mihomo-macc-src"
          rm -rf "$SRC"
          git clone --depth 1 --branch Meta https://github.com/edwardlewis35/mihomo.git "$SRC"
          mkdir -p src-tauri/sidecar
          OUT="src-tauri/sidecar/verge-mihomo-${TARGET}${EXT}"
          ( cd "$SRC" && \
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -tags "with_gvisor" -trimpath \
              -ldflags "-s -w -buildid= -X 'github.com/metacubex/mihomo/constant.Version=macc-${TARGET}'" \
              -o "$GITHUB_WORKSPACE/$OUT" . )
          chmod +x "$OUT" 2>/dev/null || true
          # alpha sidecar uses the same macc core, so prebuild.mjs has
          # nothing left to download from MetaCubeX/mihomo.
          cp "$OUT" "src-tauri/sidecar/verge-mihomo-alpha-${TARGET}${EXT}"
          ls -la src-tauri/sidecar/
          echo "--- macc evidence ---"
          grep -a -c "N8tY4q1xLk" "$OUT" | sed "s/^/MaccSalt occurrences: /"
          grep -a -o "macc-${TARGET}" "$OUT" | head -1
          ls -la "$OUT"

      - name: Pnpm install and check
        if: github.event.inputs[matrix.input] == 'true'
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Release ${{ env.TAG_CHANNEL }} Version
        if: github.event.inputs[matrix.input] == 'true'
        run: pnpm release-version ${{ env.TAG_NAME }}

      - name: Add Rust Target
        if: github.event.inputs[matrix.input] == 'true'
        run: |
          # Ensure cross target is installed for the pinned toolchain; fallback without explicit toolchain if needed
          rustup target add ${{ matrix.target }} --toolchain 1.99.1 || rustup target add ${{ matrix.target }}
          rustup target list --installed
          echo "Rust target ${{ matrix.target }} installed."

      - name: Select Apple signing credentials
        if: github.event.inputs[matrix.input] == 'true'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_IN: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_IN: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # GitHub Actions defines a secret-derived env var as "" when the
          # secret is missing, and tauri-bundler only checks whether the var
          # exists -- an empty APPLE_CERTIFICATE makes it try to import a
          # non-existent .p12 and the macOS job dies in codesign. Export the
          # Apple vars into GITHUB_ENV only when a real certificate exists.
          if [ -n "${CERT}" ]; then
            echo "APPLE_CERTIFICATE=$CERT" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID_IN" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_IN" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          else
            echo "No APPLE_CERTIFICATE secret -- macOS bundle will be unsigned."
          fi

      - name: Tauri build
        if: github.event.inputs[matrix.input] == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest' && github.event.inputs[matrix.input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest' && github.event.inputs[matrix.input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-22.04' && github.event.inputs[matrix.input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
